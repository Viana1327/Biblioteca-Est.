<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Segoe UI",system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;gap:10px;align-items:center;padding:8px 14px;background:var(--pn);border-bottom:1px solid var(--ln)}
h1{font-size:16px;margin:0;font-weight:700;white-space:nowrap}
.sp{flex:1}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:5px 11px;cursor:pointer}

input,select,textarea{background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:7px 10px;width:100%}
textarea{resize:vertical;line-height:1.55}
.pill{font-size:13px;padding:3px 10px;border-radius:99px;border:1px solid currentColor;color:var(--ok);white-space:nowrap}
.pill.sujo{color:var(--wa);font-weight:600}
.app{flex:1;display:grid;grid-template-columns:320px 1fr;min-height:0}
body.fech .app{grid-template-columns:1fr}
body.fech nav{display:none}
.app{position:relative}
nav{background:var(--sb);border-right:1px solid var(--ln);overflow:auto;padding:10px}
#ops{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--ln)}
#ops select,#ops input{grid-column:1/-1}
#ops .w{grid-column:1/-1}
.gh{width:100%;text-align:left;border:0;background:transparent;font-weight:700;padding:7px 4px;margin-top:6px}
.mat-c{color:var(--mu);font-weight:400;font-size:13px}
.mr{display:flex}
.mt{flex:1;text-align:left;border:0;background:transparent;padding:5px 8px 5px 18px;border-radius:6px}
.mt.on{background:var(--pn);box-shadow:inset 3px 0 0 var(--ac);font-weight:600}
.mr>button:last-child{border:0;background:transparent;color:var(--mu)}
.tp{display:flex;gap:9px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:4px 8px 4px 34px;border-radius:6px;font-size:14px}
.tp.on{background:var(--pn);box-shadow:inset 3px 0 0 var(--ac);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;flex:none;border:2px solid var(--mu)}
main{overflow:auto;padding:22px 28px}
.cr{color:var(--mu);font-size:14px}
.tit{font-size:24px;font-weight:700;border:0;border-bottom:2px solid var(--ln);border-radius:0;padding:4px 0;background:transparent}

.cols{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;margin-top:14px}
label{display:block;font-weight:600;margin-bottom:14px}
label>*{font-weight:400;margin-top:5px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px}
.row select{width:auto}
.vid{aspect-ratio:16/9}
iframe,video{width:100%;border:0;border-radius:8px;background:#000}
.vid iframe{height:100%}
#visor iframe{height:70vh}
.dica{color:var(--mu);font-size:13px;margin:6px 0 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0 24px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:14px}
.card b{display:block;font-size:28px;line-height:1.1}
.log,.arq{list-style:none;padding:0;margin:10px 0;max-width:760px}
.log li,.arq li{padding:8px 0;border-bottom:1px solid var(--ln)}
.log li{display:flex;gap:14px}
.log time{color:var(--mu);font-size:13px;flex:none;width:118px}
.lk{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--ln);border-radius:0;background:transparent}
details textarea{margin-top:6px}
dialog{border:1px solid var(--ln);border-radius:10px;background:var(--pn);color:var(--ink);width:min(380px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dl{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
@media(max-width:860px){
.app,body.fech .app{grid-template-columns:1fr;grid-template-rows:1fr}
nav{position:absolute;top:0;bottom:0;left:0;width:min(330px,90vw);z-index:20;border-right:1px solid var(--ln);box-shadow:6px 0 18px rgba(0,0,0,.35)}
.cols{grid-template-columns:1fr}main{padding:16px}h1{display:none}}

#ops{display:block;position:sticky;top:-10px;margin:-10px -10px 6px;padding:10px;background:var(--sb);z-index:2;border-bottom:1px solid var(--ln)}
.nv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.nv button{padding:6px 4px;font-size:13px}
.ex summary{cursor:pointer;font-size:14px;color:var(--mu)}
.exg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.exg select{grid-column:1/-1}
.gp{margin-top:8px}
.gh{display:flex;justify-content:space-between;align-items:center;border-left:4px solid var(--c)!important;padding:6px 8px;margin:0;background:var(--pn)!important;border-radius:6px}

.mt{display:flex;justify-content:space-between;gap:8px;text-align:left}
.bar{height:6px;background:var(--ln);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--ok))}
.chip{background:var(--c);color:#fff;border-radius:99px;padding:1px 10px;font-size:13px}
.bc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--mu);margin-bottom:12px}
.bc button{border:0;background:none;padding:0;color:var(--ac)}
.hd{background:var(--pn);border:1px solid var(--ln);border-left:6px solid var(--c);border-radius:10px;padding:14px 18px;margin-bottom:16px}
.hd .bar{margin-top:10px}
.p{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:16px;margin-bottom:16px}
.p h3{margin:0 0 10px;font-size:15px}
.p h3+h3{margin-top:0}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;align-items:start}
.pc{background:var(--pn);border:1px solid var(--ln);border-top:5px solid var(--c);border-radius:10px;padding:14px}

.pc .bar{margin:8px 0}
.mi{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--ln);border-radius:0;background:transparent;padding:6px 2px;font-size:14px}
.mi:hover{color:var(--ac)}
.tc{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border-radius:10px;padding:12px;min-height:84px}
.tc.add{align-items:center;justify-content:center;border-style:dashed;color:var(--mu)}
.cont{display:block;width:100%;text-align:left;background:var(--ac);color:var(--acx);border-color:var(--ac);padding:14px 18px;border-radius:10px;margin-bottom:16px}
.cont b{display:block;font-size:18px}
.sec{margin:0 0 10px}
.cols{margin-top:0}

:root{--s-estudar:#5B6B82;--s-estudando:#B8740A;--s-revisar:#6D4BC7;--s-mais:#D1432F;--s-concluido:#157A47}

.s-estudar,.dot.estudar{--sc:var(--s-estudar)}.s-estudando,.dot.estudando{--sc:var(--s-estudando)}.s-revisar,.dot.revisar{--sc:var(--s-revisar)}

.dot.estudar{background:transparent}
.bd{font-size:12px;font-weight:600;border:1px solid var(--sc);color:var(--sc);background:color-mix(in srgb,var(--sc) 13%,transparent);border-radius:99px;padding:0 9px;white-space:nowrap}
.seg,.seg2{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border-color:var(--sc);color:var(--sc);background:transparent;font-weight:600}
.seg button[aria-pressed=true]{background:var(--sc);color:var(--acx)}
.seg2 button{padding:2px 10px;font-size:13px}
.seg2 button[aria-pressed=true]{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.card[class*=" s-"]{border-top:4px solid var(--sc)}
.card[class*=" s-"] b{color:var(--sc)}
.tc[class*=" s-"]{border-left:5px solid var(--sc)}
.bloco{position:sticky;top:0}
.bt{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.bt h3{margin:0!important}
.bloco textarea{height:calc(100vh - 290px);min-height:260px;line-height:26px;padding:4px 12px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 25px,var(--ln) 25px,var(--ln) 26px);background-attachment:local}
.bloco .row{margin:10px 0 0}

[hidden]{display:none!important}
#bNotas,.xn{display:none}
@media(max-width:860px){
#bNotas:not([hidden]){display:inline-block}
.xn{display:inline-block}
.bloco{display:none;position:fixed;top:52px;right:0;bottom:0;width:min(430px,94vw);z-index:15;margin:0;border-radius:10px 0 0 10px;box-shadow:-6px 0 18px rgba(0,0,0,.35);overflow:auto}
body.notas .bloco{display:block}
.bloco textarea{height:calc(100vh - 230px)}
}
button.card{display:block;text-align:left;width:100%;cursor:pointer;font:inherit}
button.card:hover{box-shadow:0 2px 10px rgba(0,0,0,.18);border-color:var(--sc,var(--ac))}
.seg button small{font-weight:400;opacity:.85}

#intro{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;display:flex;align-items:center;justify-content:center;padding:20px}
.ib{max-width:780px;width:100%;position:relative}
.ib h2{font-size:28px;margin:0 0 10px}
.ix{position:absolute;right:0;top:0}
.cgr{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.cc{text-align:left;padding:20px;border-radius:12px;border:1px solid var(--ln);border-top:6px solid var(--c);background:var(--pn);cursor:pointer}
.cc:hover,.cc:focus-visible{border-color:var(--c);box-shadow:0 4px 16px rgba(0,0,0,.18)}
.cc h4{font-size:18px;margin:0 0 4px}
header{flex-wrap:wrap}
#bPasta{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bPasta.ok{border-color:var(--ok);color:var(--ok)}
#bPasta.sujo{border-color:var(--wa);color:var(--wa);font-weight:600}
</style>

  GF.forEach((l,i)=>{const id='g'+i;if(db.mats.some(m=>m.id===id))return;
    const[per,nome,h,tp='']=l.split('|');
    db.mats.push({id,curso:'fisio',nome,per,h:+h,notas:'',arqs:[],topicos:tp?tp.split(';').map((t,j)=>({id:id+'t'+j,titulo:t,explicacao:'',video:'',notas:'',status:'estudar',tempo:0,arqs:[]})):[]});n++;});

}

/* ---------- pasta do computador ---------- */
const limpa=s=>String(s).replace(/[\\/:*?"<>|]+/g,'_').replace(/\s+/g,' ').trim().slice(0,80)||'sem-nome';
async function permissao(pedir){
  if(!pasta)return pastaOk=false;
  try{
    if(!pasta.queryPermission)return pastaOk=true;
    const o={mode:'readwrite'};
    if(await pasta.queryPermission(o)==='granted')return pastaOk=true;
    if(pedir&&await pasta.requestPermission(o)==='granted')return pastaOk=true;
  }catch(e){}
  return pastaOk=false;
}
function atualizaPasta(){
  const b=$('#bPasta');if(!temFS){b.hidden=true;return;}
  b.hidden=false;
  b.textContent=!pasta?'📁 Escolher pasta':(pastaOk?'📁 '+pasta.name:'📁 Reconectar: '+pasta.name);
  b.className=!pasta?'':(pastaOk?'ok':'sujo');
  b.title=!pasta?'Escolha uma pasta do computador para guardar seus arquivos e dados':(pastaOk?'Arquivos e dados são salvos na pasta "'+pasta.name+'" (clique para trocar)':'Clique para permitir de novo o acesso à pasta "'+pasta.name+'"');
}
async function dirDe(caminho,criar){let d=pasta;for(const p of caminho)d=await d.getDirectoryHandle(p,{create:criar});return d;}
function dirDoNodo(){
  const c=limpa(CURSOS.find(x=>x.id===cur()).nome);
  if(view==='top'){const{m,t}=achar(selT);return[c,limpa(m.nome),limpa(t.titulo)];}
  return[c,limpa(mat(selM).nome)];
}
async function gravaNaPasta(f,dir){
  const d=await dirDe(dir,true);let nome=limpa(f.name),i=1;
  const ext=nome.includes('.')?nome.slice(nome.lastIndexOf('.')):'',base=ext?nome.slice(0,-ext.length):nome;
  for(;;){try{await d.getFileHandle(nome);nome=`${base} (${++i})${ext}`;}catch(e){break;}}
  const fh=await d.getFileHandle(nome,{create:true});
  await f.stream().pipeTo(await fh.createWritable());
  return nome;
}
async function gravaDados(d){
  try{const fh=await pasta.getFileHandle('_biblioteca-dados.json',{create:true});const w=await fh.createWritable();await w.write(JSON.stringify(d,null,1));await w.close();}
  catch(e){pastaOk=false;atualizaPasta();alert('Não consegui gravar os dados na pasta: '+e.message+'\nClique em "📁" no topo para reconectar.');}
}
async function migrar(){
  const itens=[];
  db.mats.forEach(m=>{const c=limpa(CURSOS.find(x=>x.id===(m.curso||'eca')).nome);
    m.arqs.forEach(a=>{if(a.loc!=='pasta')itens.push([a,[c,limpa(m.nome)]]);});
    m.topicos.forEach(t=>t.arqs.forEach(a=>{if(a.loc!=='pasta')itens.push([a,[c,limpa(m.nome),limpa(t.titulo)]]);}));});
  if(!itens.length)return;
  if(!confirm(`Há ${itens.length} arquivo(s) guardado(s) no navegador. Mover para a pasta do computador agora?\n(Depois de copiados, eles são apagados do navegador.)`))return;
  let ok=0;
  for(const[a,dir]of itens){
    try{const blob=await idbDo('readonly',s=>s.get(a.id));if(!blob)continue;
      a.arquivo=await gravaNaPasta(new File([blob],a.nome,{type:a.tipo}),dir);a.dir=dir;a.loc='pasta';delBlobs.push(a.id);ok++;}catch(e){}}
  if(ok){mudou('mig','Arquivos movidos para a pasta do computador ('+ok+')');salvar();render();}
  alert(ok+' de '+itens.length+' arquivo(s) movido(s) para a pasta.');
}
async function aoConectar(){
  let existe=false;
  try{
    const d=JSON.parse(await(await(await pasta.getFileHandle('_biblioteca-dados.json')).getFile()).text());
    if(Array.isArray(d.mats)){
      existe=true;
      if(d.salvoEm!==db.salvoEm){
        const novo=(d.salvoEm||'')>(db.salvoEm||'');
        if(confirm(`Esta pasta tem uma biblioteca salva em ${dt(d.salvoEm)}; a deste navegador foi salva em ${db.salvoEm?dt(db.salvoEm):'—'}.\n${novo?'A da pasta é mais recente.':'A deste navegador é mais recente.'}\n\nOK = carregar a biblioteca da pasta (substitui a deste navegador)\nCancelar = manter a deste navegador`)){
          d.mats.forEach(m=>{m.curso=m.curso||'eca';});db={...d,log:d.log||[]};
          try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){}
          pend.clear();dirty=false;selM=selT=null;view='home';
          if(mesclarNativas()){pend.set('nf','Matérias novas adicionadas');salvar();}
          render();
        }
      }
    }
  }catch(e){}
  if(!existe)gravaDados(db);
  await migrar();render();
}
async function escolherPasta(){
  if(!temFS)return;
  if(pasta&&!pastaOk){await permissao(true);atualizaPasta();if(pastaOk)await aoConectar();return;}
  if(pasta&&pastaOk&&!confirm('Trocar a pasta atual ("'+pasta.name+'") por outra?\nOs arquivos já salvos continuam na pasta antiga.'))return;
  let hd;try{hd=await showDirectoryPicker({mode:'readwrite',id:'biblioteca-estudos'});}catch(e){return;}
  pasta=hd;pastaOk=true;
  try{await idbDo('readwrite',s=>s.put(hd,'raiz'),'cfg');}catch(e){}
  atualizaPasta();await aoConectar();
}

function pararCron(){

  if(t){t.tempo=(t.tempo||0)+Math.round((Date.now()-cron.ini)/1000);mudou('tp'+t.id,`Tempo de estudo registrado em "${t.titulo}"`);}

function parar(){if('speechSynthesis' in window)speechSynthesis.cancel();}
function ouvir(txt,vel){
  if(!('speechSynthesis' in window))return alert('Este navegador não suporta leitura em voz alta.');
  parar();const v=speechSynthesis.getVoices();
  const voz=v.find(x=>/pt[-_]br/i.test(x.lang))||v.find(x=>/^pt/i.test(x.lang));
  (txt.match(/[^.!?\n]+[.!?]*/g)||[]).forEach(p=>{if(!p.trim())return;const u=new SpeechSynthesisUtterance(p.trim());u.lang='pt-BR';u.rate=vel;if(voz)u.voice=voz;speechSynthesis.speak(u);});
}
function videoHTML(u){
  u=(u||'').trim();if(!u)return'';
  if(!/^https?:\/\//i.test(u))return'<p class="dica">Use um link que comece com http:// ou https://</p>';
  const lk=`<p class="dica"><a href="${esc(u)}" target="_blank" rel="noopener">Abrir vídeo em nova aba</a></p>`;
  const y=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
  if(y)return`<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${y[1]}" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="Videoaula"></iframe></div>`+lk;
  if(/\.(mp4|webm|ogg)(\?|$)/i.test(u))return`<video controls src="${esc(u)}"></video>`+lk;
  return lk;
}

function prog(ms){let c=0,n=0;ms.forEach(m=>m.topicos.forEach(t=>{n++;if(t.status==='concluido')c++;}));return{c,n,p:n?Math.round(100*c/n):0};}
function bar(p,cor){return`<div class="bar" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%;${cor?'background:'+cor:''}"></i></div>`;}
function rArv(){
  const q=filtro.toLowerCase();let h='';
  GRUPOS.forEach(g=>{
    const all=mats().filter(m=>m.per===g);
    const ms=all.filter(m=>!q||(m.nome+' '+m.notas+' '+m.topicos.map(t=>t.titulo+' '+t.explicacao+' '+t.notas).join(' ')).toLowerCase().includes(q));
    if(!ms.length)return;
    const go=q||grp.has(g),pr=prog(all);
    h+=`<div class="gp" style="--c:${pcor(g)}"><button class="gh" data-a="grp" data-g="${g}" aria-expanded="${!!go}"><span>${go?'▾':'▸'} ${gname(g)}</span><span class="mat-c">${pr.c}/${pr.n}</span></button>${bar(pr.p,'var(--c)')}`;
    if(go)ms.forEach(m=>{
      const p=prog([m]);
      h+=`<div class="mr"><button class="mt${view==='mat'&&selM===m.id?' on':''}" data-a="mat" data-m="${m.id}"><span>${esc(m.nome)}</span>${p.n?`<span class="mat-c">${p.c}/${p.n}</span>`:''}</button><button data-a="novoT" data-m="${m.id}" aria-label="Novo tópico em ${esc(m.nome)}" title="Novo tópico">+</button></div>`;
      if(q||aberto.has(m.id))m.topicos.filter(t=>!q||(t.titulo+t.explicacao+t.notas).toLowerCase().includes(q)).forEach(t=>{
        h+=`<button class="tp${view==='top'&&selT===t.id?' on':''}" data-a="top" data-t="${t.id}"><i class="dot ${t.status}"></i><span>${esc(t.titulo||'(sem título)')}</span></button>`;});

   <div class="cols"><div>
    <div class="p"><h3>Explicação / resumo</h3><textarea id="fExp" rows="8" aria-label="Explicação">${esc(t.explicacao)}</textarea>
     <div class="row" style="margin:10px 0 0"><button id="bOuvir">Ouvir</button><button id="bPausa">Pausar</button><button id="bCont">Continuar</button><button id="bParar">Parar</button>
      <select id="fVel" aria-label="Velocidade"><option value="0.8">Lento</option><option value="1" selected>Normal</option><option value="1.3">Rápido</option></select></div></div>
    <div class="p"><h3>Vídeo</h3><input id="fVid" value="${esc(t.video)}" placeholder="Link do vídeo (YouTube ou arquivo)" aria-label="Link do vídeo"><div id="vid">${videoHTML(t.video)}</div></div>
    <div class="p">${pastaHTML(t)}</div>
   </div><div>${blocoHTML(m,t)}<button id="bDel" class="perigo">Excluir tópico</button></div></div>`;
  const on=(id,ev,fn)=>$(id).addEventListener(ev,fn);
  on('#fTit','input',e=>{t.titulo=e.target.value;mudou('tit'+t.id,`Título alterado para "${t.titulo}"`);rArv();});
  on('#fExp','input',e=>{t.explicacao=e.target.value;mudou('exp'+t.id,`Explicação editada em "${t.titulo}"`);});
  on('#fVid','change',e=>{t.video=e.target.value.trim();$('#vid').innerHTML=videoHTML(t.video);mudou('vid'+t.id,`Vídeo atualizado em "${t.titulo}"`);});
  on('#bOuvir','click',()=>ouvir(t.explicacao,+$('#fVel').value));
  on('#bPausa','click',()=>speechSynthesis.pause());on('#bCont','click',()=>speechSynthesis.resume());on('#bParar','click',parar);
  on('#bDel','click',()=>{
    if(!confirm(`Excluir o tópico "${t.titulo}", suas anotações e arquivos?`))return;
    t.arqs.forEach(x=>delBlobs.push(x.id));m.topicos=m.topicos.filter(x=>x!==t);parar();
    mudou('dt'+t.id,`Tópico excluído: "${t.titulo}"`);selM=m.id;ir('mat');});
  tickCron();cnt();
}
function tickCron(){
  const b=$('#bCron');if(!b)return;const{t}=achar(selT);
  const run=cron&&cron.id===t.id;
  b.textContent=run?'Parar cronômetro':'Iniciar cronômetro';
  $('#cron').textContent='Total: '+fmt((t.tempo||0)+(run?Math.round((Date.now()-cron.ini)/1000):0));
}
setInterval(()=>{if(cron&&view==='top')tickCron();},1000);

function render(){const cc=CURSOS.find(c=>c.id===cur());$('#cursoNome').textContent=cc.sigla;$('#bCurso').title='Curso atual: '+cc.nome+' — clique para trocar';const nb=$('#bNotas');nb.hidden=!(view==='top'||view==='mat');if(nb.hidden)document.body.classList.remove('notas');rArv();view==='top'?rTop():view==='mat'?rMat():view==='hist'?rHist():view==='status'?rStatus():rHome();estado();}
function ir(v){parar();if(v!=='top')pararCron();view=v;render();}

/* ---------- exportação ---------- */
function coletar(esc_){
  const full=(m,t)=>t.explicacao||t.notas||t.arqs.some(a=>a.transc);
  if(esc_==='t'){const{m,t}=achar(selT);return t?[{m,ts:[t]}]:[];}
  if(esc_==='m'){const m=mat(selM)||(achar(selT).m);return m?[{m,ts:m.topicos}]:[];}
  return mats().map(m=>({m,ts:m.topicos.filter(t=>full(m,t))})).filter(x=>x.ts.length||x.m.notas);
}
function exportar(fmtId){
  const it=coletar($('#esc').value);
  if(!it.length)return alert('Selecione um tópico ou matéria (ou escreva algo) para exportar.');
  fmtId==='pdf'?exPDF(it):exPPT(it);
}
function exPDF(it){
  const pre=s=>esc(s).replace(/\n/g,'<br>');
  let h='';
  it.forEach(({m,ts})=>{
    h+=`<h1>${esc(m.nome)}</h1><p class="s">${gname(m.per)} · ${m.h}h</p>`+(m.notas?`<h3>Anotações da matéria</h3><p>${pre(m.notas)}</p>`:'');
    ts.forEach(t=>{
      h+=`<h2>${esc(t.titulo)}</h2><p class="s">${STATUS[t.status]}</p>`+(t.explicacao?`<p>${pre(t.explicacao)}</p>`:'')+(t.notas?`<h3>Anotações</h3><p>${pre(t.notas)}</p>`:'');
      t.arqs.filter(a=>a.transc).forEach(a=>{h+=`<h3>Transcrição: ${esc(a.nome)}</h3><p>${pre(a.transc)}</p>`;});
    });
  });
  const w=window.open('','_blank');if(!w)return alert('O navegador bloqueou a nova janela. Permita pop-ups para exportar em PDF.');
  w.document.write(`<!DOCTYPE html><meta charset="utf-8"><title>Estudos</title><style>body{font:14px/1.6 "Segoe UI",sans-serif;max-width:760px;margin:30px auto;padding:0 20px}h1{margin:30px 0 4px;page-break-before:always}h1:first-of-type{page-break-before:auto}h2{margin:22px 0 2px}.s{color:#666;margin:0 0 8px}</style>${h}<p class="s">Use "Salvar como PDF" na janela de impressão.</p>`);
  w.document.close();setTimeout(()=>w.print(),400);
}
async function exPPT(it){
  try{
    if(!window.PptxGenJS)await new Promise((ok,er)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pptxgenjs/3.12.0/pptxgen.bundle.js';s.onload=ok;s.onerror=()=>er(new Error('Precisa de internet na primeira vez para carregar o gerador de slides.'));document.head.appendChild(s);});
    const p=new PptxGenJS();p.layout='LAYOUT_WIDE';
    const partes=s=>{const r=[];let c='';(s||'').split('\n').forEach(l=>{if((c+l).length>700&&c){r.push(c);c='';}c+=l+'\n';});if(c.trim())r.push(c);return r;};
    const slide=(tit,txt)=>{const s=p.addSlide();s.addText(tit,{x:.6,y:.4,w:12,h:.9,fontSize:28,bold:true,color:'14233A'});if(txt)s.addText(txt.trim(),{x:.6,y:1.4,w:12,h:5.5,fontSize:20,valign:'top',fit:'shrink'});};
    it.forEach(({m,ts})=>{
      const c=p.addSlide();c.addText(m.nome,{x:.6,y:2.4,w:12,h:1.4,fontSize:38,bold:true,color:'0B5CAD'});c.addText(gname(m.per),{x:.6,y:3.8,w:12,h:.6,fontSize:20,color:'58687F'});
      partes(m.notas).forEach((x,i)=>slide('Anotações da matéria'+(i?' ('+(i+1)+')':''),x));
      ts.forEach(t=>{
        const corpo=[...partes(t.explicacao).map(x=>['',x]),...partes(t.notas).map(x=>['Anotações: ',x])];
        if(!corpo.length)slide(t.titulo,'');
        corpo.forEach(([pf,x],i)=>slide(t.titulo+(i?' ('+(i+1)+')':''),pf+x));
      });
    });
    await p.writeFile({fileName:'estudos-'+new Date().toISOString().slice(0,10)+'.pptx'});
  }catch(e){alert('Não foi possível gerar os slides: '+e.message);}
}

/* ---------- eventos ---------- */
async function acao(b){
  const a=b.dataset.a,m=b.dataset.m?mat(b.dataset.m):null;
  if(['mat','top','home','hist','status'].includes(a)&&innerWidth<=860)ui(true);
  if(a==='grp'){const g=b.dataset.g;grp.has(g)?grp.delete(g):grp.add(g);rArv();}
  else if(a==='mat'){parar();pararCron();selM=m.id;view='mat';aberto.add(m.id);grp.add(m.per);render();}
  else if(a==='top'){parar();if(cron&&cron.id!==b.dataset.t)pararCron();selT=b.dataset.t;const r=achar(selT);selM=r.m.id;view='top';aberto.add(r.m.id);grp.add(r.m.per);render();}
  else if(a==='curso'){parar();pararCron();curso=b.dataset.c;$('#intro').hidden=true;selM=selT=null;view='home';grp.clear();grp.add('1');filtro='';$('#busca').value='';render();}
  else if(a==='home'||a==='hist')ir(a);
  else if(a==='status'){parar();pararCron();selS=b.dataset.s;view='status';render();}
  else if(a==='novaM'){
    const n=await ask('Nome da nova matéria');if(!n)return;
    const x={id:uid(),curso:cur(),nome:n,per:'X',h:0,notas:'',arqs:[],topicos:[]};db.mats.push(x);grp.add('X');selM=x.id;view='mat';
    mudou('cm'+x.id,`Matéria criada: ${n}`);render();}
  else if(a==='novoT'){
    const n=await ask(`Novo tópico em "${m.nome}"`);if(!n)return;
    const t={id:uid(),titulo:n,explicacao:'',video:'',notas:'',status:'estudar',tempo:0,arqs:[]};
    m.topicos.push(t);aberto.add(m.id);grp.add(m.per);selM=m.id;selT=t.id;view='top';mudou('ct'+t.id,`Tópico criado: "${n}" em ${m.nome}`);render();}
  else if(a==='pdf'||a==='ppt')exportar(a);
  else if(a==='bkp'){
    const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));
    l.download='estudos-backup-'+new Date().toISOString().slice(0,10)+'.json';l.click();URL.revokeObjectURL(l.href);}
  else if(a==='imp')$('#arq').click();
  else if(a==='cron'){
    const{t}=achar(selT);if(cron&&cron.id===t.id){pararCron();}else{pararCron();cron={id:t.id,ini:Date.now()};}tickCron();}
  else if(a==='fechaNotas'){document.body.classList.remove('notas');$('#bNotas').setAttribute('aria-expanded','false');}
  else if(a==='addArq'){if(pasta&&!pastaOk){await permissao(true);atualizaPasta();}$('#fArq').click();}
  else if(a==='st'){const{t}=achar(selT);t.status=b.dataset.s;mudou('st'+t.id,`Status de "${t.titulo}": ${STATUS[t.status]}`);
    document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.s===t.status));rArv();}
  else if(a==='aba'){abaNota=b.dataset.b;$('#fNot').value=alvoNota().notas;
    document.querySelectorAll('.seg2 button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.b===abaNota));cnt();}
  else if(a==='hora')insere(new Date().toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})+' — ');
  else if(a==='tempoMidia'){const md=$('#midia');if(!md)return alert('Abra um áudio ou vídeo da pasta de arquivos para marcar o tempo.');
    const s=Math.floor(md.currentTime);insere(`[${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}] `);}
  else if(a==='delArq'){
    const n=nodo(),f=n.arqs.find(x=>x.id===b.dataset.f);if(!f||!confirm(f.loc==='pasta'?`Remover "${f.nome}" da biblioteca?\nO arquivo continua na pasta do computador.`:`Remover "${f.nome}" da pasta?`))return;
    n.arqs=n.arqs.filter(x=>x!==f);if(f.loc!=='pasta')delBlobs.push(f.id);mudou('da'+f.id,`Arquivo removido: ${f.nome}`);render();}
  else if(a==='abrirArq'){
    const f=nodo().arqs.find(x=>x.id===b.dataset.f);let blob;
    if(f.loc==='pasta'){
      if(!await permissao(true)){atualizaPasta();return alert('Conecte a pasta (botão 📁 no topo) para abrir este arquivo.');}
      try{const fh=await(await dirDe(f.dir,false)).getFileHandle(f.arquivo);blob=await fh.getFile();blob=new Blob([blob],{type:f.tipo||blob.type});}
      catch(e){return alert('Arquivo não encontrado na pasta: '+f.dir.join(' / ')+' / '+f.arquivo+'\nEle pode ter sido movido, renomeado ou apagado.');}
    }else{
      try{blob=await idbDo('readonly',s=>s.get(f.id));}catch(e){}
      if(!blob)return alert('Arquivo não encontrado neste navegador (ele não vai no backup .json).');
    }
    if(urlAtual)URL.revokeObjectURL(urlAtual);urlAtual=URL.createObjectURL(blob);
    const k=/^audio/.test(f.tipo)?'audio':/^video/.test(f.tipo)?'video':'pdf';
    $('#visor').innerHTML=`<h4>${esc(f.nome)}</h4>`+(k==='pdf'?`<iframe src="${urlAtual}" title="${esc(f.nome)}"></iframe>`:`<${k} id="midia" controls src="${urlAtual}"></${k}><p><button data-a="marca" data-f="${f.id}">Marcar tempo atual na transcrição</button></p>`);
    $('#visor').scrollIntoView({behavior:'smooth'});}
  else if(a==='marca'){
    const f=nodo().arqs.find(x=>x.id===b.dataset.f),s=Math.floor($('#midia').currentTime);
    f.transc+=(f.transc&&!f.transc.endsWith('\n')?'\n':'')+`[${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}] `;
    mudou('tr'+f.id,`Transcrição editada: ${f.nome}`);
    const ta=document.querySelector(`[data-tr="${f.id}"]`);ta.value=f.transc;ta.closest('details').open=true;ta.focus();}
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)acao(b);});
document.addEventListener('input',e=>{
  if(e.target.id==='fNot'){const al=alvoNota();al.notas=e.target.value;mudou('not'+al.id,`Anotações editadas em "${al.titulo||al.nome}"`);cnt();return;}
  const id=e.target.dataset.tr;if(!id)return;
  const f=nodo().arqs.find(x=>x.id===id);f.transc=e.target.value;mudou('tr'+id,`Transcrição editada: ${f.nome}`);});
document.addEventListener('change',async e=>{
  if(e.target.id!=='fArq')return;
  const n=nodo();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(x){}
  const dir=pasta&&pastaOk?dirDoNodo():null;
  for(const f of e.target.files){
    const id=uid(),tipo=f.type||(/\.pdf$/i.test(f.name)?'application/pdf':'');
    if(dir){
      try{const arquivo=await gravaNaPasta(f,dir);n.arqs.push({id,nome:f.name,arquivo,dir,loc:'pasta',tipo,tam:f.size,transc:''});mudou('aa'+id,`Arquivo adicionado: ${f.name}`);}
      catch(err){alert('Não foi possível gravar "'+f.name+'" na pasta: '+err.message+'\nClique em "📁" no topo para reconectar a pasta.');}
      continue;
    }
    try{await idbDo('readwrite',s=>s.put(f,id));}catch(err){alert('Não foi possível guardar "'+f.name+'": '+(err.name==='QuotaExceededError'?'o navegador ficou sem espaço de armazenamento. Libere espaço no disco do computador e tente de novo.':err.message));continue;}
    n.arqs.push({id,nome:f.name,tipo:f.type||(/\.pdf$/i.test(f.name)?'application/pdf':''),tam:f.size,transc:''});
    mudou('aa'+id,`Arquivo adicionado: ${f.name}`);
  }
  render();
});
$('#busca').addEventListener('input',e=>{filtro=e.target.value.trim();rArv();});
$('#bMenu').onclick=()=>ui(!document.body.classList.contains('fech'));
$('#bSalvar').onclick=salvar;
$('#bCurso').onclick=intro;$('#introX').onclick=()=>{$('#intro').hidden=true;};
addEventListener('keydown',e=>{if(e.key==='Escape'&&curso&&!$('#intro').hidden)$('#intro').hidden=true;});
$('#bNotas').onclick=()=>{const on=document.body.classList.toggle('notas');$('#bNotas').setAttribute('aria-expanded',on);if(on){if(innerWidth<=860)ui(true);setTimeout(()=>{const t=$('#fNot');if(t&&innerWidth<=860)t.focus();},50);}};
$('#arq').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{
    const d=JSON.parse(await f.text());if(!Array.isArray(d.mats))throw new Error('Arquivo sem a lista de matérias.');
    if(!confirm('Substituir toda a biblioteca atual pelo backup? (os arquivos de áudio/vídeo/PDF não fazem parte do backup)'))return;
    db={mats:d.mats,log:d.log||[]};db.mats.forEach(m=>{m.curso=m.curso||'eca';});selM=selT=null;view='home';pend.set('imp','Backup importado de '+f.name);dirty=true;salvar();render();
  }catch(err){alert('Não foi possível importar: '+err.message);}};
document.addEventListener('keydown',e=>{
  if(!(e.ctrlKey||e.metaKey))return;const k=e.key.toLowerCase();
  if(k==='s'){e.preventDefault();salvar();}else if(k==='b'){e.preventDefault();$('#bMenu').click();}});
addEventListener('beforeunload',e=>{if(dirty||cron){e.preventDefault();e.returnValue='';}});
try{const u=localStorage.getItem(UIK);if(u==='1'||(u===null&&innerWidth<=860))ui(true);}catch(e){}
$('#bPasta').onclick=escolherPasta;
atualizaPasta();
if(temFS)idbDo('readonly',s=>s.get('raiz'),'cfg').then(hd=>{if(hd){pasta=hd;return permissao(false);}}).then(()=>{atualizaPasta();if(view==='top'||view==='mat')render();}).catch(()=>{});
render();intro();
</script></body></html>
